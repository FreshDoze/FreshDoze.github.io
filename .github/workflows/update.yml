name: Update prices from Google Sheets

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showcase-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch published CSV and update data.json
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
          SHEET_CONTENT_CSV_URL: ${{ vars.SHEET_CONTENT_CSV_URL }}
        run: node scripts/update.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- data.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "freshdoze-showcase-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "Update prices from Google Sheets"
          git push
